name: diag2

# TEMPORARY diagnostic for the relay sweep query semantics (manual only).
# Will be removed once the production query path is proven.

on:
  workflow_dispatch:

concurrency:
  group: eufy-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vendor/eufy-security-client/package-lock.json

      - name: Materialize stored session (secret, never printed)
        env:
          EUFY_PERSISTENT_JSON: ${{ secrets.EUFY_PERSISTENT_JSON }}
        run: |
          umask 077
          mkdir -p app/persistent-data
          printf '%s' "$EUFY_PERSISTENT_JSON" > app/persistent-data/persistent.json

      - name: Install vendored client dependencies
        working-directory: vendor/eufy-security-client
        run: npm ci --no-audit --no-fund

      - name: Run diag
        env:
          EUFY_USERNAME: ${{ secrets.EUFY_USERNAME }}
        run: |
          set -o pipefail
          node app/diag2.mjs 2>&1 | tee diag2.log

      - name: Upload diag log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag2-log
          path: diag2.log
          if-no-files-found: warn
